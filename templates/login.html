<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Login</title>
<link rel="stylesheet" href="/static/style.css"></head><body><main>
<h1>Acesso restrito</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Usuário <input name="username" maxlength="64" required autofocus></label>
<label>Senha <input name="password" type="password" maxlength="128" required></label>
<button>Entrar</button></form></main></body></html>
